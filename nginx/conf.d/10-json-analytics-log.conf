# /etc/nginx/conf.d/10-json-analytics-log.conf
# Inclus dans le contexte http {} par /etc/nginx/nginx.conf (include /etc/nginx/conf.d/*.conf).
# Nginx >= 1.11.8 requis pour escape=json.

# Vraie IP client derrière Nginx Proxy Manager (192.168.206.40).
# Si l'en-tête X-Forwarded-For est absent, $remote_addr reste l'IP du proxy.
set_real_ip_from 192.168.206.40;
real_ip_header   X-Forwarded-For;
real_ip_recursive on;

# Chemin demandé par le client, SANS query string (les paramètres peuvent contenir
# des jetons, e-mails, mots de passe). $uri n'est pas utilisé car il est modifié
# par les redirections internes (try_files, error_page).
map $request_uri $request_path_noquery {
    "~^(?<rp_path>[^?]*)"  $rp_path;
    default                "-";
}

# Aucun cookie, en-tête Authorization, corps de requête, Referer ou query string.
log_format json_analytics escape=json
    '{'
        '"timestamp":"$time_iso8601",'
        '"server_name":"$server_name",'
        '"remote_addr":"$remote_addr",'
        '"request_method":"$request_method",'
        '"uri":"$request_path_noquery",'
        '"status":"$status",'
        '"body_bytes_sent":"$body_bytes_sent",'
        '"request_time":"$request_time",'
        '"upstream_response_time":"$upstream_response_time",'
        '"http_user_agent":"$http_user_agent",'
        '"request_id":"$request_id"'
    '}';

# S'ajoute à l'access_log "combined" déjà défini dans nginx.conf (les deux sont écrits
# pendant la phase de validation ; l'ancien pourra ensuite être désactivé).
access_log /var/log/nginx/access_json.log json_analytics;
