# /etc/systemd/system/loki.service.d/override.conf
# Confinement de Loki sur la VM centrale de production (systemd 239, cgroup v1).
[Unit]
After=loki-firewall.service
Requires=loki-firewall.service

[Service]
# cgroup v1 : MemoryLimit est appliqué ; MemoryMax est ignoré (conservé pour cgroup v2).
MemoryLimit=2G
MemoryMax=2G
CPUQuota=200%
# Le runtime Go libère la mémoire avant d'atteindre la limite cgroup.
Environment=GOMEMLIMIT=1800MiB
LimitNOFILE=65536
# Durcissement : Loki n'écrit que dans /var/lib/loki.
NoNewPrivileges=true
ProtectSystem=full
ProtectHome=true
PrivateTmp=true
ReadWritePaths=/var/lib/loki
