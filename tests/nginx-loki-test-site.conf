# /etc/nginx/sites-enabled/zz-loki-test (TEMPORAIRE, tests de validation uniquement)
# Écoute uniquement sur 127.0.0.1:8088 : aucune exposition réseau.
# Les lignes sont écrites dans access_json.log (access_log hérité du contexte http)
# avec server_name "loki-test", ce qui permet de les isoler dans les requêtes.
server {
    listen 127.0.0.1:8088;
    server_name loki-test;

    # Uniquement pour ce site de test : X-Forwarded-For envoyé par curl en local est
    # accepté, ce qui permet de simuler plusieurs visiteurs distincts.
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;

    location = /test/ok          { default_type text/plain; return 200 "ok\n"; }
    location = /test/page-a      { default_type text/plain; return 200 "a\n"; }
    location = /test/page-b      { default_type text/plain; return 200 "b\n"; }
    location = /test/notfound    { return 404; }
    location = /test/error       { return 500; }
    location = /test/unavailable { return 503; }
    location = /test/static/app.js      { default_type application/javascript; return 200 "//\n"; }
    location = /test/static/missing.css { return 404; }

    # 502 : backend volontairement fermé (port 9, discard).
    location = /test/badgateway {
        proxy_pass http://127.0.0.1:9;
        proxy_connect_timeout 1s;
    }

    # URL lente : backend Python qui attend ?ms=<durée> (la query string n'est pas journalisée).
    location = /test/slow {
        proxy_pass http://127.0.0.1:8089;
        proxy_read_timeout 30s;
    }
}
